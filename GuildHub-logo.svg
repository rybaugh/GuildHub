<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F5CC3C"/>
      <stop offset="100%" stop-color="#B8820F"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1C2E52"/>
      <stop offset="100%" stop-color="#0D1828"/>
    </linearGradient>
    <linearGradient id="hubGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#D4960A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="64" height="64" fill="#0D1828"/>

  <!-- Shield gold outer -->
  <path d="M32,4 L58,13 L58,36 Q58,52 32,61 Q6,52 6,36 L6,13 Z"
        fill="url(#shieldGold)"/>

  <!-- Shield dark inner -->
  <path d="M32,9 L53,17 L53,36 Q53,49 32,57 Q11,49 11,36 L11,17 Z"
        fill="url(#shieldBg)"/>

  <!-- 5 spoke lines -->
  <line x1="32" y1="32" x2="32"   y2="16"  stroke="#F5CC3C" stroke-width="2"   opacity="0.7"/>
  <line x1="32" y1="32" x2="46"   y2="22"  stroke="#7A9AE8" stroke-width="2"   opacity="0.7"/>
  <line x1="32" y1="32" x2="43"   y2="42"  stroke="#7A9AE8" stroke-width="2"   opacity="0.7"/>
  <line x1="32" y1="32" x2="21"   y2="42"  stroke="#7A9AE8" stroke-width="2"   opacity="0.7"/>
  <line x1="32" y1="32" x2="18"   y2="22"  stroke="#F5CC3C" stroke-width="2"   opacity="0.7"/>

  <!-- Satellite nodes -->
  <circle cx="32" cy="15"  r="4.5" fill="#1C2E52" stroke="#F5CC3C" stroke-width="2"/>
  <circle cx="46" cy="21"  r="4.5" fill="#1C2E52" stroke="#7A9AE8" stroke-width="2"/>
  <circle cx="43" cy="43"  r="4.5" fill="#1C2E52" stroke="#7A9AE8" stroke-width="2"/>
  <circle cx="21" cy="43"  r="4.5" fill="#1C2E52" stroke="#7A9AE8" stroke-width="2"/>
  <circle cx="18" cy="21"  r="4.5" fill="#1C2E52" stroke="#F5CC3C" stroke-width="2"/>

  <!-- Center hub -->
  <circle cx="32" cy="32" r="7"   fill="url(#shieldBg)"  stroke="url(#hubGold)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="3.5" fill="url(#hubGold)"   filter="url(#glow)"/>
</svg>
