<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: BG color #0F0F1A -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>

    <!-- Shield fill: deep navy (SIDEBAR color) -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>

    <!-- Gold gradient: GOLD #D9A621 → TEXT_GOLD #F2CC4D -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5CC3C"/>
      <stop offset="100%" stop-color="#C08A18"/>
    </linearGradient>

    <!-- Accent blue: ACCENT #6B8ADA -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a9ae8"/>
      <stop offset="100%" stop-color="#4d6ab8"/>
    </linearGradient>

    <!-- Glow filter for center hub -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop shadow for shield -->
    <filter id="shieldShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="512" height="512" rx="72" fill="url(#bgGrad)"/>

  <!-- Subtle vignette ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#6B8ADA" stroke-width="1" opacity="0.12"/>

  <!-- ── Shield (outer gold rim) ── -->
  <path d="M256,46
           L448,112 L448,296
           Q448,406 256,472
           Q64,406 64,296
           L64,112 Z"
        fill="url(#goldGrad)" filter="url(#shieldShadow)"/>

  <!-- Shield inner (dark navy fill) -->
  <path d="M256,76
           L420,136 L420,295
           Q420,391 256,448
           Q92,391 92,295
           L92,136 Z"
        fill="url(#shieldFill)"/>

  <!-- Shield inner bevel line -->
  <path d="M256,96
           L403,151 L403,295
           Q403,380 256,430
           Q109,380 109,295
           L109,151 Z"
        fill="none" stroke="#F5CC3C" stroke-width="1.5" opacity="0.25"/>

  <!-- ── Hub network — 5 spoke nodes (pentagon, top-anchored) ──
       Center: (256, 262)   Spoke radius to node center: 108px
       Angles (deg, clockwise from top): 270, 342, 54, 126, 198
       Node coords:
         Top         (256, 154)
         Upper-right (358, 220)
         Lower-right (323, 342)
         Lower-left  (189, 342)
         Upper-left  (154, 220)
  -->

  <!-- Spoke lines (drawn first so nodes sit on top) -->
  <line x1="256" y1="262" x2="256"  y2="154" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.55"/>
  <line x1="256" y1="262" x2="358"  y2="220" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.55"/>
  <line x1="256" y1="262" x2="323"  y2="342" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.55"/>
  <line x1="256" y1="262" x2="189"  y2="342" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.55"/>
  <line x1="256" y1="262" x2="154"  y2="220" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.55"/>

  <!-- Satellite nodes -->
  <!-- Top (Members) -->
  <circle cx="256" cy="154" r="22" fill="url(#shieldFill)" stroke="url(#goldGrad)" stroke-width="3.5"/>
  <!-- icon: two person silhouette dots -->
  <circle cx="251" cy="151" r="4.5" fill="#F5CC3C" opacity="0.9"/>
  <circle cx="262" cy="151" r="3.5" fill="#F5CC3C" opacity="0.6"/>

  <!-- Upper-right (Teams) -->
  <circle cx="358" cy="220" r="22" fill="url(#shieldFill)" stroke="url(#accentGrad)" stroke-width="3.5"/>
  <!-- icon: small shield symbol -->
  <path d="M358,210 L366,213 L366,221 Q366,228 358,231 Q350,228 350,221 L350,213 Z"
        fill="none" stroke="#7a9ae8" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Lower-right (Events) -->
  <circle cx="323" cy="342" r="22" fill="url(#shieldFill)" stroke="url(#accentGrad)" stroke-width="3.5"/>
  <!-- icon: calendar dot -->
  <rect x="313" y="333" width="20" height="17" rx="2.5" fill="none" stroke="#7a9ae8" stroke-width="2.2"/>
  <line x1="313" y1="338" x2="333" y2="338" stroke="#7a9ae8" stroke-width="2"/>
  <circle cx="323" cy="346" r="2.5" fill="#7a9ae8"/>

  <!-- Lower-left (Recruit) -->
  <circle cx="189" cy="342" r="22" fill="url(#shieldFill)" stroke="url(#goldGrad)" stroke-width="3.5"/>
  <!-- icon: plus/person add -->
  <line x1="189" y1="335" x2="189" y2="349" stroke="#F5CC3C" stroke-width="2.5"/>
  <line x1="182" y1="342" x2="196" y2="342" stroke="#F5CC3C" stroke-width="2.5"/>

  <!-- Upper-left (Chat) -->
  <circle cx="154" cy="220" r="22" fill="url(#shieldFill)" stroke="url(#accentGrad)" stroke-width="3.5"/>
  <!-- icon: speech bubble -->
  <path d="M145,212 Q145,209 148,209 L161,209 Q164,209 164,212 L164,221
           Q164,224 161,224 L153,224 L149,228 L149,224 Q145,224 145,221 Z"
        fill="none" stroke="#7a9ae8" stroke-width="2" stroke-linejoin="round"/>

  <!-- ── Center hub ── -->
  <!-- Outer glow ring -->
  <circle cx="256" cy="262" r="46" fill="#D9A621" opacity="0.18" filter="url(#goldGlow)"/>
  <!-- Gold ring -->
  <circle cx="256" cy="262" r="38" fill="url(#shieldFill)" stroke="url(#goldGrad)" stroke-width="4.5"/>
  <!-- Inner gold dot -->
  <circle cx="256" cy="262" r="16" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <!-- Center highlight -->
  <circle cx="252" cy="258" r="5" fill="#fff" opacity="0.35"/>

  <!-- ── "GH" wordmark below shield tip ── -->
  <text x="256" y="498"
        font-family="'Georgia', 'Palatino Linotype', serif"
        font-size="28"
        font-weight="bold"
        letter-spacing="6"
        text-anchor="middle"
        fill="url(#goldGrad)"
        opacity="0.85">GuildHub</text>
</svg>
